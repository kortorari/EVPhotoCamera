name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -o EVPhotoCamera_github_build.zip -d source
          echo "=== Project files ==="
          find source -maxdepth 5 -type f | sort

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS=$(find source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/__MACOSX/*' | sort | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::No Gradle settings file found in ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: EVPhotoCamera-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
